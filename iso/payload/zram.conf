# FAH-NAS – Einstellungen für zram-tools (wird vom Erststart nach /etc/default/zramswap kopiert).
# Komprimierter Auslagerungsspeicher im RAM, zusätzlich zur 8-GB-Auslagerungspartition. Der zram-Bereich hat die
# höhere Priorität, die Partition ist der Rückfall, wenn zram voll ist.

# Kompressionsverfahren: zstd ist im Kernel 7.0 enthalten und komprimiert deutlich besser als lz4 bei ähnlichem Tempo.
ALGO=zstd

# Größe des zram-Bereichs in Prozent des Arbeitsspeichers.
PERCENT=50

# Priorität (höher gewinnt): vor der Auslagerungspartition (die Partition steht in /etc/fstab ohne pri= = Priorität -2).
PRIORITY=100
