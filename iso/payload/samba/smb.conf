# FAH-NAS – globale Samba-Konfiguration. Erzeugt aus src/agent/render/samba.js; nicht von Hand ändern.
# Freigaben liegen als einzelne Dateien unter /etc/samba/fahnas und werden vom Agenten gerendert.
[global]
    workgroup = WORKGROUP
    server string = FAH-NAS
    server role = standalone server
    security = user
    map to guest = Bad User
    guest account = nobody
    server min protocol = SMB2
    private dir = /data/config/samba
    passdb backend = tdbsam
    ea support = yes
    vfs objects = fruit streams_xattr
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:veto_appledouble = no
    fruit:nfs_aces = no
    fruit:wipe_intentionally_left_blank_rfork = yes
    fruit:delete_empty_adfiles = yes
    log level = 1
    logging = systemd
    include = /etc/samba/fahnas/alle.conf
