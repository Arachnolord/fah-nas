# FAH-NAS Installer – GRUB-Menü des ISO (ersetzt /boot/grub/grub.cfg des Ubuntu-Originals, BIOS und UEFI).
# Achtung Escapes: das Semikolon zwischen „ds=nocloud“ und „s=/cdrom/…“ muss für GRUB als „\;“ geschrieben werden, sonst endet der Befehl
# dort. Die Zeile muss mit „---“ enden (Ubuntu-Live-Konvention: alles danach gilt nur für das Live-System).
set timeout=10
set default=0

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "FAH-NAS installieren (Platte wird eingerichtet)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ modules-load=it87_wdt ---
	initrd	/casper/initrd
}
menuentry "FAH-NAS installieren (Textmodus/serielle Konsole)" {
	set gfxpayload=text
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ modules-load=it87_wdt console=tty0 console=ttyS0,115200n8 nomodeset ---
	initrd	/casper/initrd
}
menuentry "Von der Festplatte starten" {
	# UEFI: nächsten Eintrag der Firmware-Startreihenfolge nehmen. BIOS: die Platte mit FAHNAS-SYSTEM per Kettenstart.
	if [ "$grub_platform" = "efi" ]; then
		exit 1
	else
		insmod part_gpt
		insmod part_msdos
		insmod btrfs
		insmod chain
		insmod regexp
		if search --no-floppy --set=fahnas_teil --label FAHNAS-SYSTEM; then
			regexp --set=1:fahnas_platte '^\(?([^,)]+)' "$fahnas_teil"
			set root=($fahnas_platte)
			chainloader +1
		else
			echo "Keine Platte mit FAH-NAS gefunden."
			sleep 3
		fi
	fi
}

grub_platform
if [ "$grub_platform" = "efi" ]; then
menuentry 'UEFI-Firmware-Einstellungen' {
	fwsetup
}
fi
